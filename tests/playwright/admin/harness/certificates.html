<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Certificates bulk actions harness</title>
	<link rel="stylesheet" href="../../../../assets/css/ppcert-admin.css" />
	<style>
		body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 20px; }
		.wp-list-table { border-collapse: collapse; width: 100%; }
		.wp-list-table th, .wp-list-table td { border-bottom: 1px solid #dcdcde; padding: 6px 8px; text-align: left; }
		.tablenav { margin: 8px 0; }
		.notice { border-left: 4px solid #72aee6; padding: 1px 12px; margin: 8px 0; background: #fff; }
		.notice-warning { border-left-color: #dba617; }
		.button-link { background: none; border: 0; color: #2271b1; cursor: pointer; padding: 0; }
	</style>
</head>
<body>
	<div class="wrap">
		<h1>Certificates</h1>
		<div id="ppcert-harness-notices"></div>
		<form method="get" id="ppcert-harness-form">
			<div id="ppcert-harness-context"></div>
			<div class="tablenav top">
				<div class="alignleft actions bulkactions">
					<select name="action" id="bulk-action-selector-top"></select>
					<input type="submit" id="doaction" class="button action" value="Apply" />
				</div>
			</div>
			<table class="wp-list-table widefat fixed striped">
				<thead>
					<tr>
						<td class="manage-column column-cb check-column"><input id="cb-select-all-1" type="checkbox" /></td>
						<th class="column-credential_id">Credential ID</th>
						<th class="column-status">Status</th>
					</tr>
				</thead>
				<tbody id="the-list"></tbody>
				<tfoot>
					<tr>
						<td class="manage-column column-cb check-column"><input id="cb-select-all-2" type="checkbox" /></td>
						<th class="column-credential_id">Credential ID</th>
						<th class="column-status">Status</th>
					</tr>
				</tfoot>
			</table>
			<div class="tablenav bottom">
				<div class="alignleft actions bulkactions">
					<select name="action2" id="bulk-action-selector-bottom"></select>
					<input type="submit" id="doaction2" class="button action" value="Apply" />
				</div>
			</div>
		</form>
	</div>

	<script src="../../../../node_modules/jquery/dist/jquery.min.js"></script>
	<script src="fake-wp.js"></script>
	<script src="../../../../assets/js/ppcert-admin.js"></script>
</body>
</html>
