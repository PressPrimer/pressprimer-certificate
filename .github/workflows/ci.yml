name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  parity-pdf:
    name: Parity (PDF side)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      # The parity suite screenshots the real designer canvas and
      # compares it against the PDF raster, so it needs a browser and
      # the built harness bundle - not just the PHP side.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build designer harness
        run: npm run build:harness

      - name: Run designer suite
        run: npx playwright test --project=designer-canvas

      # ADVISORY while the starter designs are still iterating (Ryan,
      # 2026-07-23): Linux FreeType vs macOS CoreText anti-aliasing
      # reshuffles which templates clear the 1% pixel budget after each
      # redesign, and re-tuning per tweak is wasted effort. The
      # thresholds are UNCHANGED - this step reports but does not fail
      # the build. Prompt 5.4 (Full Test Pass) removes continue-on-error
      # and restores the release-blocker gate against the final designs.
      - name: Run parity suite (GD path - advisory until 5.4)
        continue-on-error: true
        run: npx playwright test --project=parity-pdf

  php-compatibility:
    name: PHP 7.4+ Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Check PHP 7.4+ Compatibility
        run: |
          vendor/bin/phpcs \
            --standard=PHPCompatibilityWP \
            --runtime-set testVersion 7.4- \
            --extensions=php \
            --ignore=vendor/,node_modules/,build/,src/,fonts/tcpdf/ \
            .

  syntax-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -print0 | xargs -0 -n1 php -l

  js-build:
    name: JavaScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build assets
        run: npm run build

  js-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Lint JavaScript
        run: npm run lint:js --if-present
